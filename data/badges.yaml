# Badges. Conditions use the same keys as ranks (see src/rules.ts):
#   answers, points, honesty_points, sets_done, levels_done, honest_calls,
#   letters_right, empty_streak, clean_streak, false_alarms, calibration, badges
# Keep the ids stable: earned badges are stored by id in the player's browser.

badges:
  - id: first-set
    title: First set
    how: Finish any exercise set.
    requires: { sets_done: 1 }
  - id: apprentice
    title: Alphabet apprentice
    how: Finish all five look-alike sets.
    requires: { levels_done: [0] }
  - id: sigma-spotter
    title: Round-letter practice
    how: Match Ε or Ϲ three times. Choices, clues and repeated images count.
    requires: { letters_right: { letters: [Ϲ, Ε], count: 3 } }
  - id: no-false-alarms
    title: No false alarms in a row
    how: Say “no letter” on five empty tiles in a row.
    requires: { empty_streak: 5 }
  - id: honest-eye
    title: Honest eye
    how: Use “?” five times where the reference leaves room for uncertainty.
    requires: { honest_calls: 5 }
  - id: steady-hand
    title: Steady hand
    how: Ten good or honest answers in a row.
    requires: { clean_streak: 10 }
  - id: calibrated
    title: Confident practice
    how: At least 20 answers marked “sure”, with nine in ten fully matching the reference. Choices, clues and repeats count.
    requires: { calibration: { sure_answers: 20, right_share: 0.9 } }
