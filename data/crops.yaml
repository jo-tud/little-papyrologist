# Image crops for levels 1–3. tools/make_items.py turns this file into
# public/images/*.webp and data/items.yaml. Edit this file, not items.yaml.
#
# Rules (see LICENSES.md and README):
#   - a crop's answer comes only from an edition checked by papyrologists, from the
#     organizers' tracing of an infrared photo, or from the way the tile was made (empty tiles);
#   - lines with lost letters ([ ]) are refused; letters with a dot below are marked uncertain;
#   - every image names its source, license and credit.

sources:
  pherc0500p2-ir:
    title: PHerc. 500 P2, infrared photograph (1050 nm) with the organizers' ink tracing
    page: https://dl.ash2txt.org/fragments/PHerc0500P2/
    files:
      image: https://dl.ash2txt.org/fragments/PHerc0500P2/paths/2um_front_surface/500P2_ir.png
      tracing: https://dl.ash2txt.org/fragments/PHerc0500P2/paths/2um_front_surface/500P2_inklabels.png
      mask: https://dl.ash2txt.org/fragments/PHerc0500P2/paths/2um_front_surface/500P2_mask.png
    work_scale: 4            # crops below are in pixels of the image shrunk by this factor
    license: CC BY-NC 4.0
    credit: Vesuvius Challenge (infrared photograph, registration and ink tracing)
    source_ids: [pherc0500p2-ir]
  paris4-banner:
    title: PHerc. Paris 4, Grand Prize 2023 image (ink detection output)
    page: https://scrollprize.org/grandprize
    files:
      image: https://scrollprize.org/img/grandprize/youssef_text_wbb-hq.webp
    license: CC BY-NC 4.0
    credit: Vesuvius Challenge; EduceLab, University of Kentucky
    source_ids: [grandprize]

sets:
  - id: first-letters-500p2
    level: 1
    title: First real letters
    ordered: true
  - id: first-line
    level: 2
    title: Your first line
    ordered: true
    intro: Start with familiar shapes, read short groups and compare handwriting in different lines. Trying the whole line at the end is optional. A reading guide is available whenever you need it.
  - id: ir-500p2
    level: 2
    title: Look closer — ink or papyrus?
    intro: Now practise a different question. These infrared photographs show an opened fragment. Compare possible ink with the organizers' tracing; letter suggestions are welcome but are not graded.
  - id: paris4-col-8
    level: 2
    title: More lines from PHerc. Paris 4
    intro: Try eight published lines and seven small windows. Some lines are demanding; use the optional reading guide or ? for a letter you cannot read. You can return for more practice later.
  - id: harder-images
    level: 3
    title: When the image gets harder
    ordered: true
    intro: Progress through five image changes, from mild blur to missing detail. These are teaching variants of known sources, not scans at a different resolution. Compare each answer with the unchanged reference.
  - id: harder-practice
    level: 3
    title: Altered-image practice library
    practice_only: true

# Level 1 moves from clearer shapes to pairs, then unscored handwriting comparisons.
# Every identity comes from the pinned manifest. Unfamiliar shapes are taught explicitly.
photographs:
  set: first-letters-500p2
  base_url: https://huggingface.co/datasets/scrollprize/profilometer/resolve/a806bead2f3b9100c20e19de37814fb285cfeefd/
  papyrus_dir: pherc0500p2
  license: CC BY-NC 4.0
  credit: Vesuvius Challenge
  source_ids: [profilometer, topography2026]
  items:
    - id: photo-248-epsilon
      papyrus_dir: pherc0248
      sample: ε
      stage: First shapes
      choices: [Ε, Ο, Λ]
      preparation: >-
        Epsilon can have a rounded back in handwriting. Compare the practice drawing with
        printed Ε below: both stand for Epsilon.
      question: Which letter has an open curve and a middle stroke, like this photograph?
      hint: Look at the complete curved outline and the stroke reaching into it.
      explain: >-
        The published identification is Epsilon. In this photograph its back is curved,
        while the printed Ε has a straight back. The middle stroke is clearly visible.
        The drawing is a simplified guide; the photo shows the actual handwriting.
    - id: photo-250-omicron
      papyrus_dir: pherc0250
      sample: ο
      stage: First shapes
      choices: [Ο, Λ, Π]
      preparation: >-
        Now compare the main outline. A handwritten loop can be uneven, and small ink marks
        can extend beyond it.
      question: Which letter has a closed loop like the main shape in this photograph?
      hint: Follow the ink around the central opening. Focus on that loop, not the small projecting marks.
      explain: >-
        The published identification is Omicron. The main ink shape encloses an opening;
        its outline is uneven and has projecting marks. It need not be a perfect printed Ο
        to be the same letter.
    - id: photo-500p2-iota-tau
      sample: ιτ
      stage: Two neighbouring letters
      choices: [ΙΤ, ΟϹ, ΜΝ]
      preparation: >-
        Move from one letter to two. Compare them from left to right, one at a time;
        their strokes need not have the proportions of the printed choices.
      question: Which pair names these two handwritten letters, from left to right?
      hint: Look for a single upright, followed by an upright with a top bar.
      explain: >-
        The source names this pair Iota–Tau. The left letter is a single upright; the right
        has a top bar. We write the pair as ΙΤ, using printed letters to record the reading.
    - id: photo-500p2-nu2
      sample: ν2
      task: study
      stage: Meet a handwritten Nu
      preparation: >-
        Now look at less familiar handwriting. These next examples give you the published
        names and the ink tracing before asking you to move on. They are not scored.
      explain: >-
        The source identifies this as Nu. Compare the sloping link and the uprights with
        printed Ν. Their angles and lengths differ from the neat reference drawing.
        Keep this example in mind for the next photograph.
    - id: photo-500p2-nu
      sample: ν
      task: study
      stage: The same letter can look different
      compare_with: photo-500p2-nu2
      preparation: Compare two photographs that the source identifies as Nu.
      explain: >-
        This is also labelled Nu in the source, although its linking stroke is much flatter.
        Compare the two photographs rather than expecting either to copy printed Ν exactly.
        A confirmed reading can still be difficult to recognize in an isolated image.
    - id: photo-500p2-eta
      sample: η
      task: study
      stage: A less familiar Eta
      preparation: >-
        This example is identified as Eta in the published study. Look at the named photograph
        and tracing together; an unfamiliar form is something to learn, not a reason to guess.
      explain: >-
        We record this letter as Η (Eta). In this photograph, the connecting stroke sits high,
        and the right upright extends only a little above it. That can make the shape look
        unlike printed Η. The source establishes the letter's identity; the photograph alone
        does not establish why a particular stroke is short.

    - id: photo-250-rho
      papyrus_dir: pherc0250
      sample: ρ
      practice_only: true
      stage: A rounded head and a descending stroke
      choices: [Ρ, Ο, Λ]
      preparation: >-
        Real ink may not form an uninterrupted outline. Here the rounded head has
        a gap at its lower left. Compare the whole main shape, including the stroke
        that continues below it.
      question: Which letter has a rounded head with a stroke extending below it?
      hint: >-
        Follow the large central head and the descending stroke. The separate
        fragments at the image edges are not the target.
      explain: >-
        The published sample is labelled Rho. Its main ink shape has a rounded head
        and a stroke extending below it. The outline is interrupted: use the red
        tracing to compare the visible marks. The photograph does not establish
        why the gap is there. Printed Ρ is a reference for the letter's name,
        not an exact drawing of this hand.

# Later practice: infrared photo. The crops have no verified coordinate-matched letter
# readings here, so only the presence of traced ink is scored.
ir_tiles:
  source: pherc0500p2-ir
  set: ir-500p2
  size: 520                # output size of the longer side, in pixels
  window: [520, 480]       # every tile has the same size, so its shape gives nothing away
  ink:                     # centres of tiles with traced ink
    - { id: ir-500p2-a, at: [1725, 1675] }
    - { id: ir-500p2-b, at: [1150, 2630] }
    - { id: ir-500p2-c, at: [2235, 2400] }
    - { id: ir-500p2-d, at: [1050, 3225] }
    - { id: ir-500p2-e-v2, at: [1825, 3100] }
    - { id: ir-500p2-f, at: [950, 4025] }
    - { id: ir-500p2-g, at: [1900, 4025] }
    - { id: ir-500p2-h, at: [1850, 4650] }
    - { id: ir-500p2-i, at: [1950, 5400] }
    - { id: ir-500p2-j, at: [2750, 5400] }
    - { id: ir-500p2-k, at: [1150, 6175] }
    - { id: ir-500p2-l, at: [2050, 6150] }
  # Empty tiles are found by the generator: inside the fragment, far from any tracing,
  # and without dark patches. The ids are fixed so that results stay comparable.
  empty:
    ids: [ir-500p2-x1, ir-500p2-x2, ir-500p2-x3, ir-500p2-x4]
    min: 4                 # fewer than this many clean windows is an error
    margin: 80             # minimum distance to any traced stroke (work pixels)
    dark_percentile: 6     # a pixel darker than this percentile of the fragment counts as dark
    max_dark_share: 0.004  # windows with more dark pixels are not used: they might hold untraced ink
    avoid:                 # areas with untraced dark marks: no empty tiles from here
      - [2450, 0, 3747, 6790]   # right side of the fragment
  explain_ink: >-
    The red overlay marks ink traced by the organizers. This exercise checks whether you
    spotted ink. If you suggested letters, they are saved but not graded: we do not have a
    verified letter-by-letter reading matched to this infrared crop.
  explain_empty: >-
    This area was selected away from the organizers' ink tracing and from dark marks in the
    infrared photo. Here, fibres, shadows and wear can suggest a letter shape. The reference
    shows no visible ink strokes in this crop; that does not make every untraced area blank.

# Level 2: column −8 of PHerc. Paris 4 in the Grand Prize image, read in the edition.
# Coordinates are pixels of the full image (16000 × 1932).
lines:
  source: paris4-banner
  set: paris4-col-8
  reading_source: cerc54
  column: −8
  height: 100
  x: [8190, 9210]
  items:                   # y = centre of the line
    - { line: 4, y: 398, edition: "ὃ κα̣ὶ ὑπ’ ἄλλων δοκεῖ" }
    - { line: 5, y: 500, edition: "γείνεϲθαι, παραπλη-" }
    - { line: 6, y: 595, edition: "ϲίωϲ δ̣’ ο̣ὐδὲ παρ’ ἑτέρωι" }
    - { line: 8, y: 790, edition: "εἶναι καὶ παρὰ πλε̣ί-" }
    - { line: 11, y: 1088, edition: "ο̣ὐκ ἤδ̣η τὰ ϲπάνια" }
    - { line: 12, y: 1185, edition: "πάντωϲ κα̣ὶ ἡδίω" }
    - { line: 14, y: 1395, edition: "νομίζ̣ο̣με̣ν. οὐ γὰρ" }
    - { line: 16, y: 1595, edition: "λοϲ ε̣ἴη{ι}, καὶ κάπ̣πα-" }
  explain: >-
    Read as a continuous line: no spaces, no accents. Strokes reaching in from the lines above
    and below are not part of the answer. Letters printed with a dot below are uncertain even
    for the editors; "?" there counts as an honest answer.

# Level 2 windows: all the same size. "text" windows lie inside column −8;
# "blank" windows lie in the empty space between columns −9/−8 and −8/−7, where the
# edition records no writing (the columns are "separated by blank spaces of about 17 mm").
windows:
  source: paris4-banner
  set: paris4-col-8
  reading_source: cerc54
  size: [120, 240]         # x, y size in image pixels
  text:
    - { id: paris4-col-8-w1, at: [8500, 380], lines: "4–6" }
    - { id: paris4-col-8-w2, at: [8800, 750], lines: "8–9" }
    - { id: paris4-col-8-w3, at: [8350, 1050], lines: "11–13" }
    - { id: paris4-col-8-w4, at: [8650, 1550], lines: "16–17" }
  blank:
    - { id: paris4-col-8-b1, at: [9205, 380], between: "−8 and −7" }
    - { id: paris4-col-8-b2, at: [9205, 1000], between: "−8 and −7" }
    - { id: paris4-col-8-b3, at: [8060, 230], between: "−9 and −8" }
  explain_text: >-
    This window lies inside column −8, across lines {lines}. The edition reads these lines in
    full; the letters are bright strokes that hold together.
  explain_blank: >-
    This is the blank space between columns {between}. In this scroll the columns are separated
    by about 17 mm of empty papyrus. The white specks are noise from the ink model: they are
    scattered and do not join into strokes.

# Source-aligned fragments of the existing column −8, line 5.
lesson:
  set: first-line
  level: 2

# The source reading remains unchanged while its view becomes harder to inspect.
degradations:
  set: harder-images
  level: 3
  items:
    - {id: harder-d1-ink, base: ir-500p2-a, degradation: 1}
    - {id: harder-d1-blank, base: ir-500p2-x1, degradation: 1}
    - {id: harder-d1-letters, base: first-line-gamma-epsilon-iota, degradation: 1}
    - {id: harder-d2-blank, base: ir-500p2-x2, degradation: 2}
    - {id: harder-d2-ink, base: ir-500p2-b, degradation: 2}
    - {id: harder-d3-line, base: paris4-col-8-l05, degradation: 3}
    - {id: harder-d3-ink, base: ir-500p2-c, degradation: 3}
    - {id: harder-d3-blank, base: ir-500p2-x3, degradation: 3}
    - {id: harder-d4-blank, base: ir-500p2-x4, degradation: 4}
    - {id: harder-d4-ink, base: ir-500p2-d, degradation: 4}
    - {id: harder-d5-ink, base: ir-500p2-e-v2, degradation: 5}
    - {id: harder-d5-blank, base: ir-500p2-x1, degradation: 5}
