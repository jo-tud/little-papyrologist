# GENERATED by tools/make_items.py from crop and corpus manifests. Do not edit by hand.
# Field meanings: see the comment at the top of data/crops.yaml and src/types.ts.
# truth: capitals as read; "*" = ink present, letters not confirmed; "none" = no text.

sets:
- id: first-letters-500p2
  level: 1
  title: First real letters
  ordered: true
- id: first-line
  level: 2
  title: Your first line
  ordered: true
  intro: Start with familiar shapes, read short groups and compare handwriting in different lines. Whole
    lines are available as an optional challenge. A reading guide is available whenever you need it.
- id: ir-500p2
  level: 2
  title: Look closer — ink or papyrus?
  intro: Now practise a different question. These infrared photographs show an opened fragment. Compare
    possible ink with the organizers' tracing; letter suggestions are welcome but are not graded.
  retired: true
  practice_only: true
- id: paris4-col-8
  level: 2
  title: Read short groups
  intro: Read two to four letters at a time, with occasional windows of ink or empty papyrus. Whole lines
    are an optional challenge.
  ordered: true
- id: harder-images
  level: 3
  title: When the image gets harder
  ordered: true
  intro: Progress through five image changes, from mild blur to missing detail. These are teaching variants
    of known sources, not scans at a different resolution. Compare each answer with the unchanged reference.
  retired: true
  practice_only: true
- id: harder-practice
  level: 3
  title: Altered-image practice library
  practice_only: true
  retired: true
- id: long-lines
  level: 2
  title: Whole lines · optional challenge
  practice_only: true
  intro: A longer challenge with the published reading on request. Return to short groups whenever you
    like.
- id: originals-3
  level: 3
  title: New places, familiar letters
  intro: Read short groups from several columns of PHerc. Paris 4.
  ordered: true
- id: originals-4
  level: 4
  title: More letter combinations
  intro: Follow familiar shapes in new combinations.
  ordered: true
- id: originals-5
  level: 5
  title: Curves and corners
  intro: Compare rounded letters, broad feet and joining strokes.
  ordered: true
- id: originals-6
  level: 6
  title: Meet another hand
  intro: Start with a guided example from PHerc. 1667, then compare both scrolls.
  ordered: true
- id: originals-7
  level: 7
  title: Changing letter shapes
  intro: The same letters can look different from one hand to another.
  ordered: true
- id: originals-8
  level: 8
  title: Across two scrolls
  intro: Read fresh passages from both papyri, a few letters at a time.
  ordered: true
- id: originals-9
  level: 9
  title: Joining the strokes
  intro: Look closely where strokes meet or outlines become less distinct.
  ordered: true
- id: originals-10
  level: 10
  title: Less distinct originals
  intro: Try naturally harder groups; use ? whenever a letter remains unclear.
  ordered: true
- id: originals-11
  level: 11
  title: Broken outlines
  intro: Compare surviving strokes with the published reading.
  ordered: true
- id: originals-12
  level: 12
  title: Mixed reading challenge
  intro: Bring the forms together in varied, more demanding originals.
  ordered: true
