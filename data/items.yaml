sets:
- id: first-letters-500p2
  level: 1
  title: First real letters
  ordered: true
- id: first-line
  level: 2
  title: Your first line
  ordered: true
  intro: Start with familiar shapes, read short groups and compare handwriting in different lines. Trying
    the whole line at the end is optional. A reading guide is available whenever you need it.
- id: ir-500p2
  level: 2
  title: Look closer — ink or papyrus?
  intro: Now practise a different question. These infrared photographs show an opened fragment. Compare
    possible ink with the organizers' tracing; letter suggestions are welcome but are not graded.
- id: paris4-col-8
  level: 2
  title: More lines from PHerc. Paris 4
  intro: Try eight published lines and seven small windows. Some lines are demanding; use the optional
    reading guide or ? for a letter you cannot read. You can return for more practice later.
- id: harder-images
  level: 3
  title: When the image gets harder
  ordered: true
  intro: Progress through five image changes, from mild blur to missing detail. These are teaching variants
    of known sources, not scans at a different resolution. Compare each answer with the unchanged reference.
- id: harder-practice
  level: 3
  title: Altered-image practice library
  practice_only: true
